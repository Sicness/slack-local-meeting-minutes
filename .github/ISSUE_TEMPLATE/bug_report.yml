name: Bug report
description: Something does not work
body:
  - type: markdown
    attributes:
      value: "**Do not attach recordings, transcripts, minutes, voice data or logs from real meetings.** They contain other people's voices and words. Remove names and meeting content from anything you paste."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `ma doctor`
      render: text
    validations:
      required: true
  - type: input
    id: slack
    attributes:
      label: Slack version
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no real meeting data
          required: true
