name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install uv ffmpeg
      - run: uv run --directory pipeline pytest

  swift:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - run: swift --version
      - run: recorder/scripts/test.sh
      - run: swift build -c release
        working-directory: recorder
      - name: Recorder loads on this macOS
        run: recorder/.build/release/MeetingRecorder help
      - run: swift build -c release
        working-directory: diarizer
      - name: Diarizer loads on this macOS
        run: |
          code=0
          diarizer/.build/release/ma-diarize >/dev/null 2>&1 || code=$?
          test "$code" -lt 128

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/install.sh
